<script>
  /* Đặt theme + ngôn ngữ TRƯỚC lượt vẽ đầu — không thì trang nháy một nhịp màu sai */
  (function () {
    try {
      var th = localStorage.getItem('joystart_theme');
      var dark = th === 'dark' || (th !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.lang = localStorage.getItem('joystart_lang') === 'vi' ? 'vi' : 'ja';
    } catch (e) { /* chế độ riêng tư */ }
  })();
</script>
