/* ==========================================================================
   JOY START — mockup
   Giao diện theo hệ thiết kế của JOY Analytics (dr-joy/joy-analytics):
   liquid glass · bộ màu EMBER (cam) · 2 theme sáng/tối · font Outfit/Space
   Grotesk/Source Sans 3. Token + công thức kính chép NGUYÊN từ `src/index.css`
   của JOY Analytics để hai sản phẩm đọc ra cùng một chất liệu.

   Khác JOY Analytics, CỐ Ý:
   · KHÔNG có nền ribbon (`.jw-net`) — chỉ giữ 3 vệt loang màu của `.jw-ambient`
     để kính có thứ phía sau mà nhoè. Muốn nền PHẲNG hẳn: xoá khối §Nền.
   · CHỈ bộ màu Ember — không có `[data-palette='rime']`.
   · KHÔNG có header: bố cục theo mockup gốc — side panel cao hết màn (logo Dr.JOY ở
     đỉnh, profile + nút cài đặt ở đáy), nội dung bên phải.
   · Màu nhấn = CAM Dr.JOY `#f08c00` ở CẢ HAI theme (không dùng cam cháy #c2571a của
     Ember). Chỉ chữ cam trên nền SÁNG hạ nhẹ xuống `#cc7400` (cùng hue) để đạt 3:1.
   · Nền: theme sáng SÁNG hơn Ember, theme tối TỐI hơn Ember.
   · Tiếng Việt: Outfit KHÔNG có subset vietnamese (thiếu U+1EA0–1EF1: ạ ả ấ ệ ộ…)
     ⇒ ở `:lang(vi)` chữ TRƯNG BÀY đổi sang Be Vietnam Pro; SỐ vẫn đi Outfit.
   ========================================================================== */

/* §Token — bộ Ember, theme SÁNG (chép từ JOY Analytics) */
:root {
  color-scheme: light;
  --ground: #f5f2ed;
  --surface: #ffffff;
  --surface-2: #ebe6de;
  --line: #ddd5ca;
  --line-soft: #e9e3da;
  --ink: #1c1917;
  --ink-2: #4d453f;
  --ink-3: #776c64;
  /* Cam Dr.JOY. Nền đặc/icon/vạch = đúng #f08c00; CHỮ cam trên nền sáng = #cc7400 (cùng
     hue 35°, 3,3:1 trên panel) — #f08c00 làm chữ chỉ được 2,4:1. */
  --accent: #f08c00;
  --accent-text: #cc7400;
  --accent-hover: #de8100;
  --accent-soft: rgba(240, 140, 0, 0.12);
  --accent-line: rgba(240, 140, 0, 0.4);
  --accent-fill: #f08c00;
  --on-accent: #ffffff;
  --ok: #15803d;
  --warn: #b45309;
  --crit: #b91c1c;
  --on-crit: #ffffff;
  --glass-fill: rgba(255, 255, 255, 0.5);
  --glass-edge: rgba(255, 255, 255, 0.9);
  --glass-spec: rgba(255, 255, 255, 0.98);
  --glass-spec-lo: rgba(255, 255, 255, 0.3);
  --glass-shadow: 0 10px 34px -14px rgba(28, 25, 23, 0.22);
  --glass-fill-ctl: rgba(255, 255, 255, 0.78);
  --glass-fill-panel: rgba(255, 255, 255, 0.66);
  --glass-fill-viz: rgba(255, 255, 255, 0.52);
  --rim-hi: rgba(255, 255, 255, 0.98);
  --rim-mid: rgba(255, 255, 255, 0.34);
  --rim-lo: rgba(28, 25, 23, 0.24);
  --rim-fill-hi: rgba(255, 255, 255, 0.78);
  --rim-hi-strong: #ffffff;
  --rim-shadow-hi: 0 6px 16px -6px rgba(28, 25, 23, 0.34);
  /* Toggle (segmented + công tắc): RÃNH lõm nhẹ + NÚM là mặt nút phẳng (vành 1px + bóng nhỏ) */
  --seg-track: #f1ede7;
  --seg-edge: rgba(28, 25, 23, 0.06);
  --seg-thumb: #ffffff;
  --seg-thumb-shadow: 0 0 0 1px rgba(28, 25, 23, 0.07), 0 1px 2px rgba(28, 25, 23, 0.07), 0 3px 8px -3px rgba(28, 25, 23, 0.16);
  --seg-pad: 3px;
  --seg-dur: 0.5s;
  --seg-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --bloom-1: rgba(240, 140, 0, 0.14);
  --bloom-2: rgba(255, 180, 90, 0.14);
  --bloom-3: rgba(120, 145, 160, 0.1);
  --focus: var(--accent);
  --field-edge: color-mix(in srgb, var(--accent) 78%, transparent);
  --field-glow: 0 0 14px -3px color-mix(in srgb, var(--accent) 70%, transparent);
  --scroll-thumb: color-mix(in srgb, var(--ink) 26%, transparent);
  --scroll-thumb-hi: color-mix(in srgb, var(--ink) 42%, transparent);
  --sep: color-mix(in srgb, var(--ink) 10%, transparent);
  --table-line: color-mix(in srgb, var(--ink) 14%, transparent);
  --table-line-head: color-mix(in srgb, var(--ink) 28%, transparent);
  --sn-panel-bg: #f9f7f3;
  /* MVV: mặt PHẲNG (không gradient) — nền ấm rất nhẹ, viền cam mờ */
  --mvv-bg: #fffaf3;
  --mvv-edge: rgba(240, 140, 0, 0.24);
  --mvv-edge-hi: rgba(240, 140, 0, 0.55);
  --mvv-wash-a: rgba(240, 140, 0, 0.1);

  --mvv-ink-a: #c46200;

  /* Theme SÁNG: thẻ = mặt TRẮNG ĐỤC (kính trắng trên nền trắng không đọc ra mép), thẻ con
     trong thẻ = ngà nhạt + viền rõ; hover = phủ mực mờ (phủ trắng lên trắng thì vô hình). */
  --panel-bg: #ffffff;
  --panel-edge: #ebe5dc;
  --panel-shadow: 0 1px 2px rgba(28, 25, 23, 0.05), 0 10px 28px -18px rgba(28, 25, 23, 0.16);
  --pane-bg: #faf7f2;
  --pane-edge: #ebe4da;
  --pane-shadow: none;
  --hover-fill: rgba(28, 25, 23, 0.045);
  --field-bg: #ffffff;
  --field-line: #e2dbd0;

  /* NÚT PHẲNG (chép token của JOY Forge — flat-buttons.css — đổi sang bảng màu JOY START).
     Sáng = NHẤC LÊN (dời 2px + bóng), tối = GLOW theo màu nút chính. */
  --fb-btn-fill: var(--surface);
  --fb-btn-fill-hi: #ffffff;
  --fb-btn-edge-c: color-mix(in srgb, var(--ink) 11%, transparent);
  --fb-btn-rest: 0 1px 2px color-mix(in srgb, var(--ink) 14%, transparent);
  --fb-btn-lift-y: -2px;
  --fb-btn-lift:
    0 10px 20px -10px color-mix(in srgb, var(--ink) 50%, transparent),
    0 3px 6px -3px color-mix(in srgb, var(--ink) 22%, transparent);
  --fb-icon-lift: 0 3px 2px color-mix(in srgb, var(--ink) 26%, transparent);
  --fb-btn-glow: var(--accent-fill);
  --fb-btn-glow-ring: 0%;
  --fb-btn-glow-halo: 0%;
  --fb-btn-danger: #dc2626;
  --fb-btn-danger-hi: #c81e1e;
  --fb-float-shadow: 0 10px 34px -12px rgba(28, 25, 23, 0.3);
  /* Hiệu ứng "đèn" theo con trỏ (Reveal kiểu Windows): viền + nền sáng lên quanh chuột */
  --rv-r: 96px;
  --rv-edge: rgba(240, 140, 0, 0.75);
  --rv-fill: rgba(240, 140, 0, 0.1);
  --glass-fill-pop: rgba(255, 255, 255, 0.985);

  /* Tông cho nhãn phân loại (danh mục お知らせ · プロダクト · trạng thái).
     Chữ ĐẬM đủ tương phản trên nền kính sáng; nền chip = 13% của chính tông. */
  --tone-orange: #b56600;
  --tone-plum: #7a3d8c;
  --tone-green: #2d6a33;
  --tone-blue: #215e97;
  --tone-rose: #a0303d;
  --tone-teal: #12665f;
  --tone-gold: #7a5606;
  --tone-brown: #6b4a2b;
  --tone-slate: #4a5663;

  /* Nhịp chuyển động (chép) */
  --menu-open-dur: 0.32s;
  --menu-open-ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --menu-close-dur: 0.2s;
  --menu-close-ease: cubic-bezier(0.4, 0, 1, 1);
  --pop-item-dur: 0.26s;
  --pop-item-ease: cubic-bezier(0.2, 0.9, 0.3, 1.35);
  --screen-dur: 0.26s;
  --screen-ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --screen-pad: 1.25rem;

  /* Font */
  --font-body: 'Source Sans 3', 'Zen Kaku Gothic New', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
  --font-ui: 'Space Grotesk', 'Zen Kaku Gothic New', 'Noto Sans JP', system-ui, sans-serif;
  --font-display: 'Outfit', 'Zen Kaku Gothic New', system-ui, sans-serif;
  --font-num: 'Outfit', 'Zen Kaku Gothic New', system-ui, sans-serif;
}
/* Outfit thiếu dấu tiếng Việt ⇒ chữ trưng bày đổi họ; SỐ giữ Outfit. */

  --font-display: 'Be Vietnam Pro', 'Zen Kaku Gothic New', system-ui, sans-serif;
}

/* §Nền — chỉ 3 vệt loang (KHÔNG có ribbon của JOY Analytics) */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-user-select: none; user-select: none; }
a { color: inherit; }
svg { display: block; flex: none; }
h1, h2, h3, h4 {
  font-family: var(--font-ui);
  margin: 0;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 6px;
}
[hidden] { display: none !important; }
.jw-sr {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.jw-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }

.jw-ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(54rem 38rem at 13% 2%, var(--bloom-1) 0%, transparent 64%),
    radial-gradient(40rem 28rem at 84% 40%, var(--bloom-3) 0%, transparent 70%),
    radial-gradient(46rem 30rem at 54% 104%, var(--bloom-2) 0%, transparent 68%);
}

/* Thanh cuộn (chép) */
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
}
::-webkit-scrollbar { width: 11px; height: 11px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border-radius: 9999px;
  border: 3px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hi); background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }

/* §LỚP KÍNH CHUNG — một chỗ khai (chép) */
.jw-glass {
  --glass-blur: 16px;
  --glass-sat: 180%;
  background: var(--glass-fill);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-sat));
  border: 1px solid var(--glass-edge);
  box-shadow:
    inset 0 1px 0 var(--glass-spec),
    inset 0 -1px 0 var(--glass-spec-lo),
    var(--glass-shadow);
}
/* Ô CON nằm trong một thẻ: sáng = ngà nhạt + viền rõ (đọc ra "thẻ trên thẻ"); tối = kính nhẹ. */
.jw-pane {
  background: var(--pane-bg);
  border: 1px solid var(--pane-edge);
  box-shadow: var(--pane-shadow);
}
/* Thẻ nội dung: sáng = trắng đục; tối = kính (token ở khối theme) */
.jw-panel.jw-glass { background: var(--panel-bg); border-color: var(--panel-edge); box-shadow: var(--panel-shadow); }


/* ==========================================================================
   §Vỏ app
   ========================================================================== */
.jw-app {
  position: relative;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* Logo = mark Dr.JOY (hai bong bóng thoại, #f08c00 — HẰNG SỐ thương hiệu, không đổi theo
   theme) + chữ JOY START. Đứng ở ĐỈNH side panel, như mockup gốc; không có header. */
.jw-brandhome {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  min-width: 0;
  margin: -0.3rem -0.4rem;
  padding: 0.35rem 0.4rem;
  border-radius: 12px;
  color: inherit;
  text-decoration: none;
  transition: background 0.16s ease;
}
.jw-brandhome:hover { background: var(--hover-fill); }
.jw-brandlock { display: inline-flex; align-items: center; gap: 0.55rem; min-width: 0; }
.jw-brand-mark { width: 36px; height: 25px; flex: none; }
.jw-wordmark {
  font-family: 'Outfit', var(--font-display);
  font-size: 1.22rem;
  font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1;
  color: var(--ink);
  white-space: nowrap;
}
.jw-wordmark b { font-weight: 700; }
.jw-wordmark em { font-style: normal; font-weight: 500; color: #f08c00; margin-left: 0.18em; }

.jw-body { position: relative; flex: 1 1 0; min-height: 0; display: flex; }
.jw-main {
  position: relative;
  z-index: 1;
  flex: 1 1 0;
  min-height: 0;
  min-width: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.jw-screen { max-width: 84rem; margin: 0 auto; padding: 1.5rem var(--screen-pad) 3rem; }
/* (Nhịp vào của cả màn đã thay bằng §HIỆN DẦN KHI CUỘN — từng khối trượt lên khi vào vùng nhìn) */

/* Mở panel cài đặt / hộp thoại ⇒ nội dung phía sau nhoè (chép). Panel cài đặt mọc ra
   TỪ side panel nên chỉ nhoè vùng nội dung; hộp thoại thì nhoè cả hai. */
.jw-main, .jw-sidenav {
  transition: opacity var(--menu-close-dur) var(--menu-close-ease), filter var(--menu-close-dur) var(--menu-close-ease);
}
[data-menu-open] .jw-main,
[data-modal-open] .jw-main,
[data-modal-open] .jw-sidenav {
  opacity: 0.45;
  filter: blur(12px);
  transition: opacity var(--menu-open-dur) var(--menu-open-ease), filter var(--menu-open-dur) var(--menu-open-ease);
}

/* ==========================================================================
   §PANEL CÀI ĐẶT — mở từ nút bánh răng cạnh profile (đáy side panel).
   Cùng chất liệu + nhịp mở của menu JOY Analytics, chỉ đổi chỗ mọc: góc DƯỚI-TRÁI.
   ========================================================================== */
/* Trên ngăn kéo side panel (z 40) — panel cài đặt mở được cả từ ngăn kéo ở mobile */
.jw-scrim { position: fixed; inset: 0; z-index: 44; }
.jw-menu {
  position: fixed;
  z-index: 46;
  width: 17.5rem;
  padding: 0.5rem;
  border-radius: 18px;
  transform-origin: bottom left;
  max-height: calc(100dvh - 1rem);
  /* bay ra từ mép side panel: trượt ngang một đoạn ngắn */
  --menu-from: translateX(-10px) scale(0.96);
  overflow-y: auto;
  overscroll-behavior: contain;
  /* Side panel phía sau KHÔNG nhoè (chỉ vùng nội dung nhoè) ⇒ fill đặc hơn menu của JOY
     Analytics, không thì chữ của cây lọt qua panel. */
  background: var(--glass-fill-pop);
  --glass-blur: 26px;
  opacity: 0;
  transform: var(--menu-from);
  pointer-events: none;
  transition: opacity var(--menu-close-dur) var(--menu-close-ease), transform var(--menu-close-dur) var(--menu-close-ease);
}
.jw-menu--inside { --menu-from: translateY(8px) scale(0.96); }
.jw-menu--open {
  opacity: 1;
  transform: none;
  pointer-events: auto;
  transition: opacity var(--menu-open-dur) var(--menu-open-ease), transform var(--menu-open-dur) var(--menu-open-ease);
}
@keyframes jw-pop-item {
  from { opacity: 0; transform: scale(0.82); }
  to { opacity: 1; transform: scale(1); }
}
.jw-menu--open > * { animation: jw-pop-item var(--pop-item-dur) var(--pop-item-ease) backwards; }
.jw-menu--open > :nth-child(2) { animation-delay: 0.025s; }
.jw-menu--open > :nth-child(3) { animation-delay: 0.05s; }
.jw-menu--open > :nth-child(4) { animation-delay: 0.075s; }
.jw-menu--open > :nth-child(5) { animation-delay: 0.1s; }
.jw-menu--open > :nth-child(6) { animation-delay: 0.125s; }
.jw-menu--open > :nth-child(7) { animation-delay: 0.15s; }
.jw-menu--open > :nth-child(8) { animation-delay: 0.175s; }
.jw-menu--open > :nth-child(n + 9) { animation-delay: 0.2s; }
.jw-menu-sec {
  padding: 0.6rem 0.5rem 0.25rem;
  font-family: var(--font-ui);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.jw-menu-sep { height: 1px; margin: 0.6rem 0.25rem 0.5rem; background: var(--glass-edge); }
.jw-menu-item {
  position: relative;
  border: none;
  background: none;
  font-family: inherit;
  transition: background-color 0.16s ease, box-shadow 0.2s ease, color 0.16s ease, transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
  display: flex;
  align-items: center;
  gap: 0.55rem;
  width: 100%;
  padding: 0.5rem 0.6rem;
  border-radius: 10px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink-2);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
}
.jw-menu-item + .jw-menu-item { margin-top: 2px; }
.jw-menu-item[aria-current='page'] { color: var(--ink); }
.jw-menu-item:hover { color: var(--ink); }
.jw-menu-item svg { color: var(--ink-2); transition: color 0.16s ease; }
.jw-menu-item > span { flex: 1 1 auto; }
.jw-menu-item--go { color: var(--ink); background: var(--fb-btn-fill); box-shadow: 0 0 0 1px var(--fb-btn-edge-c), var(--fb-btn-rest); }
.jw-menu-item--go:hover {
  background: var(--fb-btn-fill-hi);
  transform: translateY(var(--fb-btn-lift-y));
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--fb-btn-glow) var(--fb-btn-glow-ring), transparent),
    0 0 18px -2px color-mix(in srgb, var(--fb-btn-glow) var(--fb-btn-glow-halo), transparent),
    0 0 0 1px var(--fb-btn-edge-c), var(--fb-btn-lift);
}
.jw-menu-item:hover svg, .jw-menu-item[aria-current='page'] svg { color: var(--accent-text); }
.jw-avatar { width: 34px; height: 34px; flex-shrink: 0; border-radius: 50%; overflow: hidden; }
.jw-avatar svg { width: 100%; height: 100%; }

/* Panel cài đặt: nhãn nhỏ ở TRÊN, segmented trải hết bề ngang ở DƯỚI (cùng component với trang) */
.jw-menu-field { display: grid; gap: 0.4rem; padding: 0.3rem 0.5rem 0.6rem; }
.jw-menu-row-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-3); }
.jw-menu-field .jw-seg { display: grid; width: 100%; }
/* 表示: ngôn ngữ + theme cùng một bề ngang */
.jw-seg:is([data-seg='setLang'], [data-seg='setTheme']) { width: 16rem; }

/* ==========================================================================
   §SIDE PANEL — cây điều hướng (chép `.jw-sidenav` + `.jw-tree-*`)
   ========================================================================== */
.jw-sidenav {
  --trunk: 13px;
  --tree-icon: 26px;
  --tree-row-pad: 5px;
  --tree-gap: 0.1rem;
  --tree-leaf-h: 30px;
  --tree-kids-gap: 0.05rem;
  --tree-kids-mt: 0.15rem;
  --tree-kids-mb: 0.35rem;
  --tree-row-h: 36px;
  --tree-branch: 17px;
  --tree-branch2: 13px;
  --tree-elbow: 6px;
  --tree-line-w: 1px;
  --tree-endgap: 5px;
  --sn-trunk: 19.2px;
  --tree-body-pad: 0.3rem;
  --tree-trunk-up: var(--tree-gap);
  --tree-ink: var(--ink-2);
  --tree-icon-ink: var(--ink-3);
  --tree-line: color-mix(in srgb, var(--ink) 34%, var(--sn-panel-bg));
}
[data-theme='dark'] .jw-sidenav { --tree-ink: var(--ink); --tree-icon-ink: var(--ink-2); }
.jw-sidenav {
  --glass-blur: 28px;
  --glass-sat: 150%;
  --sn-bar-pad-x: 0.175rem;
  position: relative;
  z-index: 2;
  flex: none;
  width: 16.25rem;
  height: 100%;
  min-height: 0;
  box-shadow: none;
  border-radius: 0;
  border-width: 0 1px 0 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: width 0.22s ease, opacity var(--menu-close-dur) var(--menu-close-ease), filter var(--menu-close-dur) var(--menu-close-ease);
}
/* 4 tầng, như mockup gốc: logo · công cụ (tìm + mở/đóng tất cả) · CÂY (cuộn riêng) · profile */
.jw-sn-brand {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.4rem;
  padding: 0.95rem 0.6rem 0.6rem 0.95rem;
}
.jw-sn-tools {
  flex: none;
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 0.15rem 0.55rem 0.6rem;
}
.jw-sn-scroll {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 0.15rem 0.55rem 1rem;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  --fade: 22px;
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 var(--fade-t, 0px), #000 calc(100% - var(--fade-b, 0px)), transparent 100%);
  mask-image: linear-gradient(180deg, transparent 0, #000 var(--fade-t, 0px), #000 calc(100% - var(--fade-b, 0px)), transparent 100%);
}
.jw-sn-scroll[data-fade-t] { --fade-t: var(--fade); }
.jw-sn-scroll[data-fade-b] { --fade-b: var(--fade); }
.jw-sn-foot {
  flex: none;
  display: flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.55rem 0.55rem 0.75rem;
  border-top: 1px solid var(--sep);
}
.jw-sn-me {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.35rem 0.4rem;
  border-radius: 12px;
  color: inherit;
  text-decoration: none;
  transition: background 0.16s ease;
}
.jw-sn-me:hover, .jw-sn-me[aria-current='page'] { background: var(--hover-fill); }
.jw-sn-me .jw-avatar { width: 36px; height: 36px; box-shadow: 0 0 0 2px var(--glass-edge); }
.jw-sn-who { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.jw-sn-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-size: 0.86rem; font-weight: 600; color: var(--ink); }
.jw-sn-mail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.7rem; color: var(--ink-3); }
.jw-sn-gear svg { transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), color 0.3s ease; will-change: transform; }
.jw-sn-gear[aria-expanded='true'] { color: var(--accent-text); }
.jw-sn-gear[aria-expanded='true'] svg { transform: rotate(120deg); }
.jw-sn-toggle, .jw-sn-tool, .jw-sn-gear {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  flex: none;
  border: 0;
  border-radius: 10px;
  background: none;
  color: var(--ink-3);
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease;
}
/* Nút CHỈ có icon: hover = đổi màu icon, KHÔNG nền */
.jw-sn-toggle:hover, .jw-sn-toggle:focus-visible, .jw-sn-tool:hover, .jw-sn-tool:focus-visible, .jw-sn-gear:hover, .jw-sn-gear:focus-visible { color: var(--accent-text); }
.jw-sn-gear { width: 38px; height: 38px; border-radius: 11px; color: var(--ink-2); }
.jw-sn-find {
  position: relative;
  flex: 0 0 34px;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  height: 34px;
  padding: 0 calc(0.25rem - 1px) 0 calc(0.55rem - 1px);
  overflow: hidden;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  transition: flex-grow 0.45s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, color 0.16s ease;
}
.jw-sn-find:hover { color: var(--accent); }
/* mở: ô GIÃN vào phần trống của hàng (flex-grow nội suy được ⇒ bung êm), 2 nút mở/đóng tất cả dạt phải */
.jw-sn-find:is(:hover, :focus-within, [data-filled]) { flex-grow: 1; background: var(--field-bg); border-color: var(--field-line); cursor: text; }
.jw-sn-find:focus-within { border-color: var(--field-edge); box-shadow: var(--field-glow); }
.jw-sn-find .jw-sn-find-input { opacity: 0; transition: opacity 0.2s ease 0.08s; }
.jw-sn-find:is(:hover, :focus-within, [data-filled]) .jw-sn-find-input { opacity: 1; }
.jw-sn-find-input { flex: 1 1 auto; min-width: 0; padding: 0; border: 0; background: none; color: var(--ink); font-size: 0.86rem; }
.jw-sn-find-input:focus { outline: none; }
.jw-sn-find-input::placeholder { color: var(--ink-3); }
.jw-sn-find-x {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 22px; height: 22px; padding: 0; border: 0; border-radius: 7px;
  background: none; color: var(--ink-3); cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease;
}
.jw-sn-find-x:hover, .jw-sn-find-x:focus-visible { color: var(--ink); }
.jw-sn-hits { display: flex; flex-direction: column; gap: 1px; }
.jw-sn-hit {
  display: flex; align-items: center; gap: 0.5rem; width: 100%;
  padding: 0.35rem 0.4rem; border: 0; border-radius: 10px; background: none;
  color: var(--tree-ink); text-align: left; text-decoration: none; cursor: pointer;
  transition: background 0.16s ease;
}
.jw-sn-hit:hover, .jw-sn-hit:focus-visible, .jw-sn-hit[data-hot] { background: var(--hover-fill); }
.jw-sn-hit-ico { display: inline-flex; flex: none; color: var(--tree-icon-ink); }
.jw-sn-hit-body { display: flex; flex-direction: column; min-width: 0; }
.jw-sn-hit-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-size: 0.84rem; font-weight: 600; color: var(--ink); }
.jw-sn-hit-path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.72rem; color: var(--ink-2); }
.jw-sn-hits-none { margin: 0.35rem 0.4rem; font-size: 0.8rem; color: var(--ink-2); }

/* お気に入り — dải nhấn nhẹ tông cam, cùng nếp hàng JOY Pilot ở JOY Analytics */
.jw-sn-favs {
  margin: 0 0 0.6rem;
  padding: 0.35rem 0.3rem 0.4rem;
  border-radius: 12px;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.jw-sn-sec {
  display: flex; align-items: center; gap: 0.35rem;
  padding: 0.1rem 0.35rem 0.25rem;
  font-family: var(--font-ui);
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--accent-text);
}
.jw-sn-fav {
  display: flex; align-items: center; gap: 0.45rem;
  padding: 0.3rem 0.4rem; border-radius: 9px;
  color: var(--tree-ink); text-decoration: none; font-size: 0.8rem;
  transition: background 0.16s ease, color 0.16s ease;
}
.jw-sn-fav:hover { background: var(--hover-fill); color: var(--ink); }
button.jw-sn-fav { width: 100%; border: 0; background: none; font: inherit; text-align: left; cursor: pointer; }
.jw-sn-fav-item { position: relative; }
.jw-sn-fav-item .jw-sn-fav-path { transition: opacity 0.12s ease; }
.jw-sn-fav-x {
  position: absolute; top: 50%; right: 4px; transform: translateY(-50%);
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; padding: 0; border: 0; border-radius: 7px;
  background: none; color: var(--ink-3); cursor: pointer; opacity: 0;
  transition: opacity 0.12s ease, color 0.12s ease, background 0.12s ease;
}
.jw-sn-fav-item:hover .jw-sn-fav-x, .jw-sn-fav-x:focus-visible { opacity: 1; }
.jw-sn-fav-item:hover .jw-sn-fav-path, .jw-sn-fav-item:focus-within .jw-sn-fav-path { opacity: 0; }
.jw-sn-fav-x:hover, .jw-sn-fav-x:focus-visible { color: var(--crit); }
@media (hover: none) {
  .jw-sn-fav-x { opacity: 0.7; }
  .jw-sn-fav-path { display: none; }
}
.jw-sn-fav > svg { color: var(--accent-text); }
.jw-sn-fav-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-weight: 600; }
.jw-sn-fav-path { flex: 0 1 auto; min-width: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.68rem; color: var(--ink-3); }

.jw-sn-nav { display: flex; flex-direction: column; gap: 0.1rem; flex: none; }
.jw-sn-block--open { display: flex; flex-direction: column; flex: none; }
.jw-sn-top {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  width: 100%;
  padding: 0.5rem 0.55rem;
  border: 0;
  border-radius: 12px;
  background: none;
  color: var(--ink-2);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease;
}
.jw-sn-topico { display: inline-flex; align-items: center; justify-content: center; width: 22px; flex: none; color: var(--ink-3); transition: color 0.16s ease; }
.jw-sn-top:hover .jw-sn-topico { color: var(--accent-text); }
.jw-sn-topname {
  flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-display); font-size: 0.94rem; font-weight: 600; letter-spacing: -0.01em;
}
.jw-sn-top:hover { background: var(--hover-fill); color: var(--ink); }
.jw-sn-caret { display: inline-flex; flex: none; color: var(--ink-3); transition: transform 0.18s ease, color 0.16s ease; }
/* Khác JOY Analytics (ở đó khối ĐANG MỞ = nền cam, vì chỉ mở được MỘT khối): ở đây mở được
   nhiều khối cùng lúc (nút "mở tất cả"), nên nền cam chỉ dành cho TRANG hiện tại ở tầng 1
   (ホーム · リンク). Khối đang mở = chữ đậm + mũi tên lật; khối CHỨA trang hiện tại = chữ cam + vạch. */
.jw-sn-top[aria-current='page'] { background: var(--accent-fill); color: var(--on-accent); }
.jw-sn-top[aria-current='page'] .jw-sn-topico { color: var(--on-accent); }
.jw-sn-block--open > .jw-sn-top { color: var(--ink); }
.jw-sn-block--open > .jw-sn-top .jw-sn-caret { transform: rotate(180deg); }
.jw-sn-block--here > .jw-sn-top { color: var(--accent-text); }
.jw-sn-block--here > .jw-sn-top .jw-sn-topico { color: var(--accent-text); }
.jw-sn-block { position: relative; }
.jw-sn-block--here::after {
  content: '';
  position: absolute;
  left: 3px;
  top: 12px;
  width: 3px;
  height: 16px;
  border-radius: 3px;
  background: var(--accent);
  pointer-events: none;
}
.jw-sn-body {
  display: flex;
  flex-direction: column;
  gap: var(--tree-gap);
  padding: var(--tree-body-pad) 0.3rem 0.6rem calc(var(--sn-trunk) + var(--tree-branch2));
}

.jw-tree-node { display: flex; flex-direction: column; position: relative; }
.jw-sn-block .jw-tree-node::before,
.jw-sn-block .jw-tree-node::after { content: ''; position: absolute; pointer-events: none; }
.jw-sn-block .jw-tree-node::before {
  left: calc(var(--tree-branch2) * -1);
  top: calc(var(--tree-trunk-up) * -1);
  bottom: 0;
  width: var(--tree-line-w);
  background: var(--tree-line);
}
.jw-sn-block .jw-tree-node:last-child::before {
  bottom: auto;
  height: calc(var(--tree-trunk-up) + var(--tree-row-h) / 2 + var(--tree-line-w) - var(--tree-elbow));
}
.jw-sn-block .jw-tree-node:first-child::before { top: calc(var(--tree-body-pad) * -1); }
.jw-sn-block .jw-tree-node:first-child:last-child::before {
  height: calc(var(--tree-body-pad) + var(--tree-row-h) / 2 + var(--tree-line-w) - var(--tree-elbow));
}
.jw-sn-block .jw-tree-node::after {
  left: calc(var(--tree-branch2) * -1);
  top: calc(var(--tree-row-h) / 2 + var(--tree-line-w) - var(--tree-elbow));
  width: calc(var(--tree-branch2) - var(--tree-endgap));
  height: var(--tree-elbow);
  border-left: var(--tree-line-w) solid var(--tree-line);
  border-bottom: var(--tree-line-w) solid var(--tree-line);
}
.jw-sn-block .jw-tree-node:has(.jw-tree-kids) > .jw-tree-row::after {
  content: '';
  position: absolute;
  /* hàng bị kéo trái --tree-endgap (margin âm) ⇒ cộng lại cho TRÙNG vạch dọc của tầng 3 */
  left: calc(var(--trunk) + var(--tree-endgap));
  top: calc((var(--tree-row-h) + var(--tree-icon)) / 2);
  width: var(--tree-line-w);
  height: calc((var(--tree-row-h) - var(--tree-icon)) / 2 + var(--tree-kids-mt));
  background: var(--tree-line);
  pointer-events: none;
}
.jw-tree-row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  width: calc(100% + var(--tree-endgap) + 0.3rem);
  margin: 0 -0.3rem 0 calc(var(--tree-endgap) * -1);
  min-height: var(--tree-row-h);
  padding: var(--tree-row-pad) 0.4rem var(--tree-row-pad) var(--tree-endgap);
  border: 0;
  border-radius: 10px;
  background: none;
  color: var(--tree-ink);
  font-size: 0.82rem;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease;
}
.jw-tree-row:hover { background: var(--hover-fill); color: var(--ink); }
.jw-tree-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: var(--tree-icon); height: var(--tree-icon);
  border-radius: 8px;
  background: var(--glass-fill);
  color: var(--tree-ink);
  flex-shrink: 0;
}
.jw-tree-row:hover .jw-tree-icon { color: var(--accent-text); }
.jw-tree-name {
  flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-display); font-weight: 600;
}
.jw-tree-count { font-size: 0.72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.jw-tree-kids {
  list-style: none;
  margin: var(--tree-kids-mt) 0 var(--tree-kids-mb);
  padding: 0 0 0 calc(var(--trunk) + var(--tree-branch));
  display: flex;
  flex-direction: column;
  gap: var(--tree-kids-gap);
}
.jw-tree-kid { position: relative; }
.jw-tree-kid::before {
  content: '';
  position: absolute;
  left: calc(var(--tree-branch) * -1);
  top: calc(var(--tree-kids-gap) * -1);
  bottom: 0;
  width: var(--tree-line-w);
  background: var(--tree-line);
}
.jw-tree-kid:first-child::before { top: 0; }
.jw-tree-kid:last-child::before { bottom: calc(50% + var(--tree-elbow) - var(--tree-line-w)); }
.jw-tree-kid::after {
  content: '';
  position: absolute;
  left: calc(var(--tree-branch) * -1);
  top: calc(50% + var(--tree-line-w) - var(--tree-elbow));
  width: var(--tree-branch);
  height: var(--tree-elbow);
  border-left: var(--tree-line-w) solid var(--tree-line);
  border-bottom: var(--tree-line-w) solid var(--tree-line);
  pointer-events: none;
}
.jw-tree-leaf {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  width: 100%;
  min-height: var(--tree-leaf-h);
  padding: 0.28rem 0.4rem 0.28rem var(--tree-endgap);
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--tree-ink);
  font-size: 0.8rem;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease;
}
.jw-tree-leaf > svg { color: var(--tree-icon-ink); flex-shrink: 0; }
.jw-tree-leaf:hover { background: var(--hover-fill); color: var(--ink); }
.jw-tree-leaf:hover > svg { color: var(--accent-text); }
.jw-tree-row.jw-tree-on, .jw-tree-leaf.jw-tree-on { background: var(--accent-soft); color: var(--accent-text); }
.jw-tree-row.jw-tree-on .jw-tree-icon, .jw-tree-leaf.jw-tree-on > svg { color: var(--accent-text); }
.jw-tree-leafname {
  flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-display);
}
/* Số việc chờ (承認 3 · 台帳 2) — chip cam đặc, khác `.jw-tree-count` (số con, chữ xám). */
.jw-count {
  flex: none;
  min-width: 1.25rem;
  padding: 0 0.38rem;
  border-radius: 999px;
  background: var(--accent-fill);
  color: var(--on-accent);
  font-family: var(--font-num);
  font-size: 0.68rem;
  font-weight: 700;
  line-height: 1.25rem;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.jw-sn-top[aria-current='page'] .jw-count { background: var(--on-accent); color: var(--accent-text); }
/* Hàng là TRANG = <a> + nút sao đứng CẠNH (nút lồng trong link là HTML sai) */
.jw-tree-item { position: relative; }
.jw-tree-item > .jw-tree-row, .jw-tree-kid > .jw-tree-leaf { padding-right: 1.9rem; }
.jw-tree-item > .jw-fav, .jw-tree-kid > .jw-fav { position: absolute; top: 50%; right: 3px; transform: translateY(-50%); }
/* `.jw-tree-row` thò ra 0.3rem bên phải (margin âm, chép) ⇒ sao lùi theo cho thẳng hàng với lá */
.jw-tree-item > .jw-fav { right: calc(3px - 0.3rem); }
.jw-tree-row--here .jw-tree-icon { color: var(--accent-text); }
.jw-sn-content { display: contents; }
/* Sao お気に入り — hiện khi hover hàng lá; đã ghim thì luôn hiện + tô cam */
.jw-fav {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 22px; height: 22px; margin-right: -2px; padding: 0; border: 0; border-radius: 7px;
  background: none; color: var(--ink-3); cursor: pointer; opacity: 0;
  transition: opacity 0.12s ease, color 0.12s ease, background 0.12s ease;
}
:is(.jw-tree-item, .jw-tree-kid, .jw-linkbtn):hover .jw-fav, .jw-fav:focus-visible { opacity: 1; }
/* Sao: hover = cam Dr.JOY; đã ghim = sao ĐẶC cam (Solar Bold). */
.jw-fav:hover { color: var(--accent); }
.jw-fav[aria-pressed='true'] { opacity: 1; color: var(--accent); }
@media (hover: none) { .jw-fav { opacity: 0.5; } }

/* DẢI GẬP (rail) — chép `.jw-sidenav--rail` */
.jw-sidenav--rail {
  --rail-pad-x: 0.3rem;
  --rail-top: 38px;
  --rail-top-r: 11px;
  width: 3.4rem;
}
.jw-sidenav--rail .jw-sn-brand { flex-direction: column; gap: 0.55rem; padding: 0.9rem var(--rail-pad-x) 0.6rem; }
.jw-sidenav--rail .jw-brandhome { margin: 0; padding: 0.3rem 0.25rem; }
.jw-sidenav--rail .jw-brand-mark { width: 32px; height: 22px; }
.jw-sidenav--rail .jw-sn-scroll { padding: 0.15rem var(--rail-pad-x) 1rem; overflow-x: hidden; scrollbar-gutter: auto; scrollbar-width: none; }
.jw-sidenav--rail .jw-sn-scroll::-webkit-scrollbar { display: none; }
.jw-sidenav--rail .jw-sn-foot { flex-direction: column; gap: 0.35rem; padding: 0.55rem var(--rail-pad-x) 0.75rem; }
.jw-sidenav--rail .jw-sn-me { flex: none; padding: 0.2rem; }
.jw-sidenav--rail :is(.jw-wordmark, .jw-sn-tools, .jw-sn-who, .jw-sn-favs, .jw-sn-body, .jw-sn-topname, .jw-sn-caret, .jw-count) { display: none; }
.jw-sidenav--rail .jw-sn-nav { gap: 0.4rem; }
.jw-sidenav--rail .jw-sn-top {
  justify-content: center;
  gap: 0;
  width: var(--rail-top);
  height: var(--rail-top);
  margin: 0 auto;
  padding: 0;
  border-radius: var(--rail-top-r);
}
.jw-sidenav--rail .jw-sn-topico { width: 34px; height: 34px; }
.jw-sidenav--rail .jw-sn-toggle { width: var(--rail-top); height: var(--rail-top); border-radius: var(--rail-top-r); }
.jw-sidenav--rail .jw-sn-block--here > .jw-sn-top,
.jw-sidenav--rail .jw-sn-top[aria-current='page'] { background: var(--accent-fill); color: var(--on-accent); }
.jw-sidenav--rail .jw-sn-block--here > .jw-sn-top .jw-sn-topico,
.jw-sidenav--rail .jw-sn-top[aria-current='page'] .jw-sn-topico { color: var(--on-accent); }
.jw-sidenav--rail .jw-sn-block--here::after { display: none; }
.jw-sidenav--rail .jw-sn-block--count::after {
  content: '';
  display: block;
  position: absolute;
  top: 5px;
  left: auto;
  right: calc(50% - 14px);
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 2px var(--sn-panel-bg);
}

/* ==========================================================================
   §TIÊU ĐỀ TRANG (chép `.jw-page-*`)
   ========================================================================== */
.jw-page-head { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1.25rem; }
/* Chuông nổi ở góc phải trên ⇒ dòng breadcrumb chừa chỗ; dòng tiêu đề đứng THẤP hơn chuông nên nút
   お気に入り dạt phải được, thẳng mép thẻ của trang. */
.jw-page-eyebrow { padding-right: 3.6rem; min-height: 1.6rem; }
.jw-page-eyebrow { display: flex; align-items: center; flex-wrap: wrap; gap: 0.15rem; font-size: 0.82rem; color: var(--ink-3); }
.jw-page-sep { display: inline-flex; padding: 0 0.1rem; opacity: 0.7; }
.jw-page-crumb-btn, .jw-page-crumb-txt {
  display: inline-flex; align-items: center; gap: 0.3rem;
  padding: 0.1rem 0.4rem; border: 0; border-radius: 6px; background: none;
  color: inherit; font-family: var(--font-display); text-decoration: none;
}
.jw-page-crumb-btn { cursor: pointer; }
.jw-page-crumb-btn:hover { color: var(--ink); background: var(--hover-fill); }
.jw-page-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.jw-page-title {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  min-width: 0;
  font-family: var(--font-display);
  font-size: 1.62rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--ink);
}
/* Icon cạnh tiêu đề trang: CHỈ icon (không nền, không viền kính) */
.jw-page-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  color: var(--accent);
}
.jw-page-icon svg { width: 1.7rem; height: 1.7rem; }
.jw-page-desc { margin: 0.3rem 0 0; max-width: 64ch; font-size: 0.96rem; color: var(--ink-2); }
.jw-page-actions { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; margin-inline-start: auto; }

/* ==========================================================================
   §CONTROL — nút · ô nhập · công tắc · segmented · tab
   ========================================================================== */
.jw-btn {
  /* NÚT PHẲNG — chép cơ chế 3 tầng của JOY Forge (flat-buttons.css):
     1 THÂN đục · 2 MẶT NGHỈ không viền (vành 1px mờ + bóng nhỏ) · 3 HOVER nhấc lên (sáng) / glow (tối).
     Biến cục bộ --btn-edge / --btn-glow / --btn-rest CHỈ khai ở biến thể; rule chung chỉ ĐỌC. */
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.4rem;
  padding: 0.5rem 1rem;
  border: none;
  border-radius: 10px;
  font-family: var(--font-ui);
  font-size: 0.85rem;
  font-weight: 600;
  line-height: 1.2;
  color: var(--ink);
  background: var(--fb-btn-fill);
  box-shadow: 0 0 0 1px var(--btn-edge, var(--fb-btn-edge-c)), var(--btn-rest, var(--fb-btn-rest));
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  user-select: none;
  transition: background-color 0.16s ease, box-shadow 0.2s ease, color 0.16s ease, transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
}
.jw-btn:not(:disabled, [aria-disabled='true']):hover { background: var(--fb-btn-fill-hi); }
.jw-btn:not(:disabled, [aria-disabled='true'], [aria-busy='true']):is(:hover, :focus-visible) {
  transform: translateY(var(--fb-btn-lift-y));
  box-shadow:
    0 0 0 1px color-mix(in srgb, var(--btn-glow, var(--fb-btn-glow)) var(--fb-btn-glow-ring), transparent),
    0 0 18px -2px color-mix(in srgb, var(--btn-glow, var(--fb-btn-glow)) var(--fb-btn-glow-halo), transparent),
    0 0 0 1px var(--btn-edge, var(--fb-btn-edge-c)),
    var(--fb-btn-lift);
}
.jw-btn:not(:disabled, [aria-disabled='true'], [aria-busy='true']):active { transform: translateY(0) scale(0.97); }
.jw-btn:disabled, .jw-btn[aria-disabled='true'] { opacity: 0.45; cursor: not-allowed; }
/* nút chính: mặt cam ĐẶC, chữ = --on-accent (sáng: trắng · tối: mực thẫm) */
.jw-btn--solid { --btn-edge: transparent; background: var(--accent-fill); color: var(--on-accent); }
.jw-btn--solid:not(:disabled, [aria-disabled='true']):hover { background: var(--accent-hover); }
/* nút phụ = thân mặc định */
.jw-btn--ghost { color: var(--ink); }
/* đang bật = LÊN TONE (pha 16% cam vào mặt), không viền màu */
.jw-btn--ghost[aria-pressed='true'], .jw-btn--on { --btn-edge: transparent; color: var(--accent-text); background: color-mix(in srgb, var(--accent-fill) 16%, var(--surface)); }
/* nguy hiểm nhẹ (chữ đỏ) / nguy hiểm (đỏ đặc) — glow ĐỎ */
.jw-btn--danger { --btn-glow: var(--fb-btn-danger); color: color-mix(in oklab, var(--crit) 80%, var(--ink)); }
.jw-btn--danger:not(:disabled, [aria-disabled='true']):hover { background: color-mix(in srgb, var(--crit) 8%, var(--fb-btn-fill)); }
.jw-btn--crit { --btn-edge: transparent; --btn-glow: var(--fb-btn-danger); background: var(--fb-btn-danger); color: #fff; }
.jw-btn--crit:not(:disabled, [aria-disabled='true']):hover { background: var(--fb-btn-danger-hi); }
.jw-btn--sm { padding: 0.36rem 0.8rem; font-size: 0.78rem; border-radius: 9px; }
.jw-btn--xs { padding: 0.22rem 0.55rem; font-size: 0.72rem; border-radius: 8px; }

/* NÚT CHỈ CÓ ICON (fb-icon): không thân ở MỌI trạng thái; hover = icon đổi sang cam + NHẤC lên
   (sáng: bóng ôm nét glyph; tối: glow 2 lớp). Nhấc + lọc cái `svg` chứ không phải cả nút — vài
   nút (sao trong cây) đang dùng `transform` để canh giữa. Nền CHỈ cho trạng thái mở/bật. */
:is(.jw-sn-tool, .jw-sn-toggle, .jw-fav, .jw-sn-fav-x, .jw-cta, .jw-iconbtn, .jw-sn-find-x, .jw-pagefav) > svg {
  transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1), filter 0.2s ease, color 0.16s ease;
}
:is(.jw-sn-tool, .jw-sn-toggle, .jw-fav, .jw-sn-fav-x, .jw-cta, .jw-iconbtn, .jw-sn-find-x, .jw-pagefav):not(:disabled):is(:hover, :focus-visible) > svg {
  transform: translateY(var(--fb-btn-lift-y));
  filter:
    drop-shadow(var(--fb-icon-lift))
    drop-shadow(0 0 1.5px color-mix(in srgb, var(--btn-glow, var(--fb-btn-glow)) var(--fb-btn-glow-ring), transparent))
    drop-shadow(0 0 8px color-mix(in srgb, var(--btn-glow, var(--fb-btn-glow)) var(--fb-btn-glow-halo), transparent));
}
.jw-sn-fav-x { --btn-glow: var(--fb-btn-danger); }
.jw-pagefav {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 38px; height: 38px; padding: 0; border: 0; border-radius: 10px;
  background: none; color: var(--ink-3); cursor: pointer;
}
.jw-pagefav:hover, .jw-pagefav:focus-visible, .jw-pagefav[aria-pressed='true'] { color: var(--accent); }

.jw-link {
  display: inline-flex;
  align-items: center;
  gap: 0.2rem;
  padding: 0.15rem 0.2rem;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--accent-text);
  font-family: var(--font-ui);
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
}
.jw-link, .jw-page-crumb-btn {
  background-image: linear-gradient(currentColor, currentColor);
  background-position: 0 100%;
  background-size: 0 1px;
  background-repeat: no-repeat;
  transition: background-size 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.16s ease;
}
.jw-link:where(:not(:disabled)):hover, .jw-page-crumb-btn:hover { background-size: 100% 1px; }
.jw-link:disabled { color: var(--ink-3); cursor: default; text-decoration: none; }
.jw-iconbtn {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 32px; height: 32px; padding: 0; border: 0; border-radius: 10px;
  background: none; color: var(--ink-2); cursor: pointer; text-decoration: none;
  transition: background 0.16s ease, color 0.16s ease;
}
.jw-iconbtn:hover { color: var(--accent-text); }
.jw-iconbtn[aria-pressed='true'] { color: var(--accent-text); background: var(--accent-soft); }

.jw-field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; max-width: 28rem; font-size: 0.8rem; font-weight: 600; color: var(--ink-2); }
.jw-input {
  width: 100%;
  min-height: 38px;
  padding: 0.45rem 0.75rem;
  border: 1px solid var(--field-line);
  border-radius: 10px;
  background: var(--field-bg);
  box-shadow: inset 0 1px 2px color-mix(in srgb, var(--ink) 6%, transparent);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 400;
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}
.jw-input::placeholder { color: var(--ink-3); }
.jw-input[data-rv] {
  border-color: transparent;
  background:
    radial-gradient(calc(var(--rv-r) * 0.8) circle at var(--mx) var(--my), var(--rv-fill), transparent 100%) padding-box,
    linear-gradient(var(--field-bg), var(--field-bg)) padding-box,
    radial-gradient(var(--rv-r) circle at var(--mx) var(--my), var(--rv-edge), transparent 70%) border-box,
    linear-gradient(var(--field-line), var(--field-line)) border-box;
}
.jw-input[data-rv]:focus { border-color: var(--field-edge); background: var(--field-bg); }
.jw-input:focus { outline: none; border-color: var(--field-edge); box-shadow: var(--field-glow); }
.jw-input[readonly] { background: var(--glass-fill); color: var(--ink-2); box-shadow: none; }
textarea.jw-input { resize: vertical; min-height: 5rem; line-height: 1.5; }
select.jw-input { cursor: pointer; }
.jw-input--sm { min-height: 32px; padding: 0.25rem 0.6rem; font-size: 0.84rem; width: auto; }
.jw-check { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.86rem; font-weight: 500; color: var(--ink); cursor: pointer; }
.jw-check input[type='checkbox'] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent-fill); cursor: pointer; }
.jw-input[type='time'] { width: 7.2rem; }

/* Công tắc bật/tắt — cùng vật liệu với `.jw-seg` (rãnh lõm + núm mặt nút phẳng), núm trượt êm */
.jw-switch { position: relative; display: inline-flex; flex: none; width: 40px; height: 24px; }
.jw-switch input { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.jw-switch span {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: var(--seg-track);
  box-shadow: inset 0 0 0 1px var(--seg-edge);
  transition: background-color 0.35s ease, box-shadow 0.35s ease;
}
.jw-switch span::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--seg-thumb);
  box-shadow: var(--seg-thumb-shadow);
  transition: transform var(--seg-dur) var(--seg-ease), background-color 0.35s ease;
}
.jw-switch input:hover + span { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 14%, transparent); }
.jw-switch input:checked + span { background: var(--accent-fill); box-shadow: inset 0 0 0 1px transparent; }
.jw-switch input:checked + span::after { transform: translateX(16px); background: #fff; }
.jw-switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Segmented `.jw-seg` — núm trượt theo --seg-i / --seg-n. Rãnh lõm nhẹ, núm = mặt nút phẳng;
   lựa chọn đang bật: chữ đậm màu mực + icon cam. Trượt 0.5s easeOutQuint (nhanh lúc đầu, đậu êm). */
.jw-seg {
  position: relative;
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(0, 1fr);
  align-items: stretch;
  padding: var(--seg-pad);
  border-radius: 12px;
  background: var(--seg-track);
  box-shadow: inset 0 0 0 1px var(--seg-edge);
  user-select: none;
  max-width: 100%;
}
.jw-seg-thumb {
  position: absolute;
  top: var(--seg-pad);
  bottom: var(--seg-pad);
  left: var(--seg-pad);
  width: calc((100% - var(--seg-pad) * 2) / var(--seg-n));
  border-radius: 9px;
  background: var(--seg-thumb);
  box-shadow: var(--seg-thumb-shadow);
  transform: translateX(calc(var(--seg-i) * 100%));
  transition: transform var(--seg-dur) var(--seg-ease);
  pointer-events: none;
}
.jw-seg-opt {
  position: relative;
  z-index: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-width: 0;
  min-height: 30px;
  padding: 0.25rem 0.9rem;
  border: none;
  border-radius: 9px;
  background: none;
  color: var(--ink-3);
  font-size: 0.8rem;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  /* Hẹp (dải icon ở mobile ăn mất 54px) thì nhãn dài XUỐNG DÒNG trong nút thay vì tràn */
  white-space: normal;
  cursor: pointer;
  transition: color 0.35s ease;
}
.jw-seg-opt > svg { flex: none; color: inherit; transition: color 0.35s ease; }
.jw-seg-opt:hover { color: var(--ink); }
.jw-seg-opt--on { color: var(--ink); cursor: default; }
.jw-seg-opt--on > svg { color: var(--accent-text); }
.jw-seg-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Dải TAB dạng viên thuốc — cuộn ngang, mờ 2 mép khi còn nội dung (nếp `.jw-gbar-strip` của JOY Analytics) */
.jw-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  padding: 2px;
  --fade: 26px;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%);
  mask-image: linear-gradient(90deg, transparent 0, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent 100%);
}
.jw-tabs { position: relative; }
/* Vệt nền của tab đang chọn — MỘT phần tử, trượt sang tab mới (app.js đặt --ink-x/-y/-w/-h;
   2 chiều nên dùng được cho tab dọc và tab xuống dòng ở mobile) */
.jw-tabs-ink {
  position: absolute;
  top: 0;
  left: 0;
  width: var(--ink-w, 0px);
  height: var(--ink-h, 0px);
  transform: translate(var(--ink-x, 0px), var(--ink-y, 0px));
  border-radius: 999px;
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent-line);
  pointer-events: none;
  transition: transform var(--seg-dur) var(--seg-ease), width var(--seg-dur) var(--seg-ease), height var(--seg-dur) var(--seg-ease);
}
.jw-tabs-ink--now { transition: none; }
.jw-tabs[data-ink] .jw-tab[aria-selected='true'] { background: transparent; border-color: transparent; }
.jw-tabs[data-fade-l] { --fade-l: var(--fade); }
.jw-tabs[data-fade-r] { --fade-r: var(--fade); }
.jw-tabs::-webkit-scrollbar { display: none; }
.jw-tab {
  position: relative;
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  height: 32px;
  padding: 0 0.8rem;
  border: 1px solid transparent;
  border-radius: 999px;
  background: none;
  color: var(--ink-2);
  font-family: var(--font-display);
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
}
.jw-tab:hover { background: var(--hover-fill); color: var(--ink); }
.jw-tab[aria-selected='true'] {
  background: var(--accent-soft);
  border-color: var(--accent-line);
  color: var(--accent-text);
}
.jw-tab svg { color: var(--ink-3); }
.jw-tab[aria-selected='true'] svg { color: var(--accent-text); }
.jw-tab-n { font-family: var(--font-num); font-size: 0.72rem; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.jw-tab[aria-selected='true'] .jw-tab-n { color: var(--accent-text); }

/* Nhãn · chip · huy hiệu */
.jw-badge {
  display: inline-flex;
  align-items: center;
  font-family: var(--font-ui);
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  line-height: 1.4;
  padding: 0.12rem 0.4rem;
  border-radius: 4px;
  background: var(--accent-soft);
  color: var(--accent-text);
  border: 1px solid var(--accent-line);
  white-space: nowrap;
}
.jw-badge--solid { background: var(--accent-fill); color: var(--on-accent); border-color: transparent; }
.jw-badge--crit { background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--crit); border-color: color-mix(in srgb, var(--crit) 34%, transparent); }
.jw-tag {
  --tone: var(--tone-slate);
  display: inline-flex;
  align-items: center;
  flex: none;
  gap: 0.25rem;
  padding: 0.08rem 0.5rem;
  border-radius: 999px;
  background: color-mix(in srgb, var(--tone) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--tone) 24%, transparent);
  color: var(--tone);
  font-family: var(--font-display);
  font-size: 0.7rem;
  font-weight: 600;
  line-height: 1.45;
  white-space: nowrap;
}
.jw-tone-orange { --tone: var(--tone-orange); }
.jw-tone-plum { --tone: var(--tone-plum); }
.jw-tone-green { --tone: var(--tone-green); }
.jw-tone-blue { --tone: var(--tone-blue); }
.jw-tone-rose { --tone: var(--tone-rose); }
.jw-tone-teal { --tone: var(--tone-teal); }
.jw-tone-gold { --tone: var(--tone-gold); }
.jw-tone-brown { --tone: var(--tone-brown); }
.jw-tone-slate { --tone: var(--tone-slate); }
.jw-tone-ok { --tone: var(--ok); }
.jw-tone-warn { --tone: var(--warn); }
.jw-tone-crit { --tone: var(--crit); }
.jw-hchip {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  flex: none;
  padding: 0.16rem 0.55rem;
  border-radius: 999px;
  background: var(--glass-fill);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--ink-2);
  white-space: nowrap;
}
.jw-note { font-size: 0.76rem; color: var(--ink-3); line-height: 1.5; }
.jw-muted { color: var(--ink-3); }
.jw-empty { margin: 0; padding: 1.75rem 0 1.25rem; text-align: center; color: var(--ink-3); font-size: 0.9rem; }
.jw-empty svg { margin: 0 auto 0.5rem; color: color-mix(in srgb, var(--ink-3) 70%, transparent); }

/* ==========================================================================
   §PANEL / thẻ nội dung (nếp `.jw-hpanel`)
   ========================================================================== */
.jw-panel {
  --glass-blur: 28px;
  --glass-sat: 150%;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
  min-width: 0;
  padding: 1.1rem 1.15rem 1.15rem;
  border-radius: 20px;
  color: var(--ink);
}
/* Icon + tên đi CHUNG một khối (`.jw-panel-lead`): tên dài (hay gặp ở tiếng Việt) xuống dòng
   NGAY BÊN icon chứ không đẩy icon đứng một mình. Cụm nút chỉ rớt xuống hàng 2 khi chỗ còn
   lại cho tên < 9rem. */
.jw-panel-head { display: flex; align-items: center; gap: 0.6rem; min-width: 0; flex-wrap: wrap; row-gap: 0.4rem; }
.jw-panel-lead { flex: 1 1 9rem; min-width: 0; display: flex; align-items: center; gap: 0.6rem; }
.jw-panel-ico {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 34px; height: 34px; border-radius: 11px;
  background: var(--glass-fill); color: var(--ink-2);
}
.jw-panel-name {
  margin: 0;
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 0.45rem;
  row-gap: 0.1rem;
  font-family: var(--font-display);
  font-size: 1.08rem;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.015em;
  color: var(--ink);
}
.jw-panel-name > span:first-child { min-width: 0; overflow-wrap: anywhere; text-wrap: balance; }
.jw-panel-sub { white-space: nowrap; }
.jw-panel-sub { font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; letter-spacing: 0; color: var(--ink-3); }
.jw-panel-actions { display: flex; align-items: center; gap: 0.5rem; margin-left: auto; flex: none; }
.jw-cta {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 30px; height: 30px; border-radius: 10px;
  color: var(--ink-2); text-decoration: none;
  transition: color 0.16s ease, background 0.16s ease;
}
.jw-panel:hover .jw-cta, .jw-cta:focus-visible { color: var(--accent-text); }
.jw-panel.jw-panel--flat { padding: 0; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.jw-tile { border-radius: 14px; padding: 0.85rem 1rem; min-width: 0; }

/* Danh sách hàng dùng chung (お知らせ · スケジュール · 受注 · ランキング…) */
.jw-rows { display: flex; flex-direction: column; min-width: 0; }
.jw-rowi {
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  min-width: 0;
  padding: 0.55rem 0.5rem;
  border: 0;
  border-radius: 10px;
  background: none;
  color: inherit;
  text-align: left;
  text-decoration: none;
  font-size: 0.86rem;
}
.jw-rowi + .jw-rowi::before {
  content: '';
  position: absolute;
  left: 0.5rem;
  right: 0.5rem;
  top: 0;
  height: 1px;
  background: var(--sep);
}
:is(a, button).jw-rowi { cursor: pointer; transition: background 0.16s ease; }
:is(a, button).jw-rowi:hover { background: var(--hover-fill); }
:is(a, button).jw-rowi:hover::before, :is(a, button).jw-rowi:hover + .jw-rowi::before { opacity: 0; }

/* ==========================================================================
   §HOME
   ========================================================================== */
.jw-home { container: home / inline-size; display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }
.jw-home-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1rem; align-items: start; }
.jw-home-col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.jw-home-col > .jw-panel + .jw-panel { margin-top: 0; }
@container home (max-width: 860px) {
  .jw-home-grid, .jw-home-col { display: contents; }
  .jw-home > * { order: 50; }
  .jw-home [data-card='hero'] { order: 1; }
  .jw-home [data-card='mvv'] { order: 2; }
  .jw-home [data-card='deal'] { order: 3; }
  .jw-home [data-card='announce'] { order: 4; }
  .jw-home [data-card='schedule'] { order: 5; }
  .jw-home [data-card='newhire'] { order: 7; }
  .jw-home [data-card='health'] { order: 8; }
  .jw-home [data-card='photos'] { order: 9; }
  .jw-home [data-card='bizdays'] { order: 10; }
  .jw-home [data-card='fx'] { order: 11; }
}

/* Ô tìm toàn bộ JOY START */
.jw-gsearch { position: relative; min-width: 0; }
.jw-gsearch-box {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  height: 46px;
  padding: 0 0.6rem 0 1rem;
  border-radius: 999px;
  color: var(--ink-3);
  --glass-blur: 20px;
  --glass-sat: 170%;
  background: var(--field-bg);
  border-color: var(--field-line);
  box-shadow: 0 1px 2px rgba(28, 25, 23, 0.04);
  transition: border-color 0.16s ease, box-shadow 0.16s ease;
}
.jw-gsearch-box:focus-within { border-color: var(--field-edge); box-shadow: var(--glass-shadow), var(--field-glow); }
.jw-gsearch-input { flex: 1 1 auto; min-width: 0; border: 0; background: none; color: var(--ink); font-size: 0.95rem; }
.jw-gsearch-input:focus { outline: none; }
.jw-gsearch-input::placeholder { color: var(--ink-3); }
.jw-gsearch-input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.jw-gsearch-box .jw-sn-find-x { width: 26px; height: 26px; border-radius: 999px; }
.jw-kbd {
  flex: none;
  padding: 0.05rem 0.4rem;
  border: 1px solid var(--glass-edge);
  border-radius: 6px;
  background: var(--glass-fill);
  font-family: var(--font-ui);
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--ink-3);
}
.jw-gs-drop {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  z-index: 20;
  max-height: min(70vh, 32rem);
  overflow-y: auto;
  padding: 0.4rem;
  border-radius: 16px;
  background: var(--glass-fill-pop);
  --glass-blur: 26px;
  animation: jw-drop-in 0.14s ease-out;
}
.jw-gs-group + .jw-gs-group { margin-top: 0.2rem; padding-top: 0.2rem; border-top: 1px solid var(--sep); }
.jw-gs-title {
  display: flex; align-items: center; gap: 0.35rem;
  padding: 0.4rem 0.55rem 0.2rem;
  font-family: var(--font-ui);
  font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em;
  color: var(--ink-3);
}
.jw-gs-item {
  position: relative;
  display: flex; align-items: center; gap: 0.55rem; width: 100%;
  padding: 0.42rem 0.55rem; border: 0; border-radius: 10px; background: none;
  text-align: left; cursor: pointer; color: var(--ink);
}
.jw-gs-item:hover, .jw-gs-item[data-hot] { background: var(--hover-fill); }
.jw-gs-item > svg { color: var(--ink-3); }
.jw-gs-item:hover > svg, .jw-gs-item[data-hot] > svg { color: var(--accent-text); }
.jw-gs-body { display: flex; flex-direction: column; min-width: 0; }
.jw-gs-name { font-family: var(--font-display); font-size: 0.86rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jw-gs-sub { font-size: 0.72rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jw-gs-all {
  display: flex; align-items: center; justify-content: center; gap: 0.35rem; width: 100%;
  margin-top: 0.3rem; padding: 0.55rem; border: 0; border-top: 1px solid var(--sep);
  border-radius: 0 0 10px 10px; background: none; color: var(--accent-text);
  font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600; cursor: pointer;
}
.jw-gs-all:hover, .jw-gs-all[data-hot] { background: var(--hover-fill); }
.jw-gs-none { padding: 1.1rem; text-align: center; font-size: 0.84rem; color: var(--ink-3); }

/* HERO — lời chào + ô tìm */
.jw-hero { display: flex; flex-direction: column; gap: 0.3rem; padding: 0.4rem 3.4rem 0.2rem 0.1rem; }
.jw-hero-date { margin: 0; font-family: var(--font-ui); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink-3); }
.jw-hero-title {
  margin: 0 0 1rem;
  font-family: var(--font-display);
  font-size: clamp(1.6rem, 1.05rem + 1.6vw, 2.4rem);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--ink);
}
.jw-hero-name { color: var(--accent-text); }
.jw-hero-search .jw-gsearch-box { height: 52px; padding-left: 1.15rem; font-size: 1rem; }

/* MVV — sân khấu chính của Home (xương sống của cả công ty) */
.jw-mvv2 {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  container: mvv / inline-size;
  display: flex;
  flex-direction: column;
  gap: clamp(1.4rem, 1rem + 1.4vw, 2.2rem);
  padding: clamp(1.4rem, 0.9rem + 2vw, 2.7rem);
  /* Viền 1px chuyển sắc (đậm ở góc phải trên — nơi có watermark — nhạt dần), nền loang rất nhẹ
     ở 2 góc chéo. Vẽ bằng nền 2 lớp padding-box / border-box để giữ được bo góc. */
  border: 1px solid transparent;
  border-radius: 28px;
  background:
    radial-gradient(70% 110% at 100% 0%, var(--mvv-wash-a), transparent 62%) padding-box,
    radial-gradient(55% 80% at 0% 100%, var(--mvv-wash-b), transparent 70%) padding-box,
    linear-gradient(var(--mvv-bg), var(--mvv-bg)) padding-box,
    linear-gradient(215deg, var(--mvv-edge-hi), var(--mvv-edge) 38%, var(--mvv-edge) 70%, color-mix(in srgb, var(--mvv-edge) 55%, transparent)) border-box;
  box-shadow: var(--mvv-shadow);
}
/* Mark Dr.JOY làm WATERMARK: đứng thẳng, nằm trọn trong khối, góc phải trên */
.jw-mvv2-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.jw-mvv2-mark { position: absolute; top: clamp(1.25rem, 2.6vw, 2.25rem); right: clamp(1.25rem, 3vw, 2.75rem); width: clamp(8rem, 13vw, 11.5rem); height: auto; opacity: 0.06; }
[data-theme='dark'] .jw-mvv2-mark { opacity: 0.08; }
.jw-mvv2-label {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.24em;
  color: var(--accent-text);
}
.jw-mvv2-label::before { content: ''; width: 1.75rem; height: 2px; border-radius: 1px; background: linear-gradient(90deg, var(--accent) 45%, color-mix(in srgb, var(--accent) 0%, transparent)); }
.jw-mvv2-top { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: clamp(1.4rem, 3vw, 3.2rem); align-items: end; }
.jw-mvv2-statement {
  margin: 0.85rem 0 0;
  font-family: var(--font-display);
  font-size: clamp(1.85rem, 1rem + 2.6vw, 3.25rem);
  font-weight: 700;
  line-height: 1.18;
  letter-spacing: -0.035em;
  color: var(--ink);
  text-wrap: balance;
}
/* 日本語: chỉ ngắt ở <wbr> (すべての｜医療従事者に、｜次の一手を) — không bẻ đôi 従事者 */
:lang(ja) .jw-mvv2-statement { word-break: keep-all; }
.jw-mvv-nb { white-space: nowrap; }
.jw-mvv2-statement .jw-mvv-nb, .jw-mvv2-num > .jw-num { color: var(--accent-text); }
/* Chữ nhấn: gradient trong CÙNG một hue (cam đậm → cam sáng), tĩnh, không ánh chạy */
@supports ((-webkit-background-clip: text) or (background-clip: text)) {
  .jw-mvv2-statement .jw-mvv-nb, .jw-mvv2-num > .jw-num {
    background: linear-gradient(100deg, var(--mvv-ink-a) 10%, var(--mvv-ink-b) 90%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .jw-mvv2-statement .jw-mvv-nb::selection, .jw-mvv2-num > .jw-num::selection { -webkit-text-fill-color: var(--ink); }
}
/* Vạch chia MISSION | VISION mờ dần ở 2 đầu */
.jw-mvv2-vision { padding-left: clamp(1rem, 2vw, 2rem); border-left: 1px solid; border-image: linear-gradient(180deg, transparent, var(--mvv-edge) 22%, var(--mvv-edge) 78%, transparent) 1; }
.jw-mvv2-vtext {
  margin: 0.75rem 0 1.1rem;
  font-family: var(--font-display);
  font-size: clamp(1.05rem, 0.9rem + 0.5vw, 1.3rem);
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.jw-mvv2-vtext .jw-mvv-em { color: var(--accent-text); }
.jw-mvv2-impact { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 0.8rem; row-gap: 0.25rem; }
.jw-mvv2-num {
  display: inline-flex;
  align-items: baseline;
  gap: 0.3rem;
  font-family: var(--font-num);

.jw-mvv2-values { display: flex; flex-direction: column; gap: 0.85rem; }

}

/* 受注速報 — 1 hàng ở khổ rộng, 2 tầng khi thẻ hẹp (container query) */

.jw-deal {

}
.jw-deal-face { grid-area: face; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; }
.jw-deal-face svg { width: 100%; height: 100%; }
.jw-deal-ae { grid-area: ae; min-width: 0; font-size: 0.8rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jw-deal-hosp { grid-area: hosp; min-width: 0; font-family: var(--font-display); font-size: 0.9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jw-deal-prod { grid-area: prod; justify-self: start; }
.jw-deal-total { grid-area: total; justify-self: end; font-family: var(--font-num); font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.jw-deal-mrr { grid-area: mrr; justify-self: end; font-family: var(--font-num); font-size: 0.76rem; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.jw-deal-date { grid-area: date; justify-self: end; display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.jw-deal-info, .jw-deal-amt { display: contents; }
.jw-deal-br { display: none; }
@container deals (max-width: 600px) {
  .jw-deal { display: flex; flex-wrap: wrap; row-gap: 0.3rem; column-gap: 0.5rem; }
  .jw-deal-face { order: 1; width: 30px; height: 30px; }
  .jw-deal-ae { order: 2; flex: 0 1 auto; }
  .jw-deal-date { order: 3; margin-left: auto; }
  .jw-deal-br { display: block; order: 4; flex: 0 0 100%; height: 0; }
  .jw-deal-info { order: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 0.3rem 0.4rem; flex: 1 1 0; min-width: 0; }
  .jw-deal-amt { order: 6; display: flex; flex-direction: column; align-items: flex-end; flex: none; line-height: 1.35; }
  .jw-deal-hosp { flex: 0 1 auto; max-width: 100%; font-size: 0.86rem; }
}

/* 新入社員 */
.jw-nh-group + .jw-nh-group { margin-top: 0.2rem; }

.jw-nh-date { font-size: 0.72rem; color: var(--ink-3); }

.jw-nh-msg { align-self: stretch; margin-top: 0.5rem; padding: 0 0.3rem; text-align: left; font-size: 0.76rem; line-height: 1.5; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

/* スケジュール */
.jw-sch-date { flex: none; display: flex; align-items: baseline; gap: 0.35rem; width: 7.4rem; font-size: 0.78rem; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.jw-sch-name { flex: 1 1 auto; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jw-sch-place { flex: none; display: inline-flex; align-items: center; gap: 0.25rem; max-width: 40%; font-size: 0.76rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

}

.jw-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.2rem, 1fr)); gap: 0.85rem 0.7rem; }

.jw-photo { display: block; min-width: 0; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; color: inherit; }
.jw-photo-thumb { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-edge); transition: box-shadow 0.16s ease, transform 0.16s ease; }

.jw-photo-thumb .jw-sample { left: 6px; top: 6px; }
.jw-photo-cap { margin-top: 0.4rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-size: 0.8rem; font-weight: 600; }
.jw-photo-meta { display: flex; align-items: center; gap: 0.35rem; min-width: 0; font-size: 0.7rem; color: var(--ink-3); }
.jw-photo-user { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jw-photo-like { flex: none; display: inline-flex; align-items: center; gap: 0.15rem; color: var(--tone-rose); font-weight: 600; font-family: var(--font-num); }

/* 四半期 · 為替 */
.jw-table-wrap { overflow-x: auto; min-width: 0; }

  font-family: var(--font-ui);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.03em;

  border-bottom: 1px solid var(--table-line-head);
  white-space: nowrap;
}

.jw-fx-to small { margin-left: 0.25rem; font-family: var(--font-ui); font-size: 0.7rem; font-weight: 600; color: var(--ink-3); }

/* ==========================================================================
   §TRANG CON
   ========================================================================== */
.jw-grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 1rem; align-items: start; }

.jw-stack { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
.jw-row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.6rem; flex-wrap: wrap; }

/* やること > 予定: thẻ gập (accordion) */
.jw-acc { padding: 0; gap: 0; overflow: hidden; }
.jw-acc-head {
  display: flex; align-items: center; gap: 0.6rem; width: 100%;
  padding: 0.95rem 1.1rem; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink);
  font-family: var(--font-display); font-size: 0.98rem; font-weight: 600;
}

.jw-acc-icon { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 10px; background: color-mix(in srgb, var(--tone) 13%, transparent); color: var(--tone); }

.jw-sum-vals { display: flex; flex-wrap: wrap; gap: 0.2rem 1.1rem; }
.jw-sum-item { font-size: 0.74rem; color: var(--ink-3); white-space: nowrap; }
.jw-sum-item b { margin-left: 0.3rem; font-family: var(--font-num); font-size: 1.15rem; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }

/* お知らせ — chi tiết */
.jw-article { max-width: 46rem; }
.jw-article-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 0.45rem; font-size: 0.8rem; color: var(--ink-3); }
.jw-article-title { margin: 0.2rem 0 0; font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; line-height: 1.4; letter-spacing: -0.015em; overflow-wrap: anywhere; }

  padding: 0.35rem 0.5rem; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; color: var(--accent-text);
  font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600;
}
.jw-pager-btn:last-child { text-align: right; align-items: flex-end; margin-left: auto; }
.jw-pager-btn:hover:not(:disabled) { background: var(--hover-fill); }

.jw-pager-sub { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-body); font-size: 0.74rem; font-weight: 400; color: var(--ink-3); }

/* 設定 */
.jw-set-list { display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; }

.jw-set-colhead { padding: 0.5rem 0.95rem; font-family: var(--font-ui); font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); background: var(--glass-fill); }

  padding: 0.7rem 0.9rem; border-radius: 12px;

}

/* リンク */

  [data-sr] { transition: opacity 0.7s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
  [data-sr]:not(.jw-sr-in) { opacity: 0; transform: translateY(22px); }
  .jw-sr-in:not(.jw-sr-done) :is(.jw-rowi, .jw-nh-card, .jw-photo, .jw-fx-row, .jw-mvv2-value, .jw-set-row, .jw-table tbody tr, .jw-linkbtn, .jw-tile, .jw-acc-item) {
    animation: jw-sr-item 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) backwards;
    animation-delay: calc(var(--sr-i, 0) * 45ms + 140ms);
  }
  .jw-sr-in:not(.jw-sr-done) .jw-mvv2-statement { animation: jw-sr-rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.1s backwards; }
  .jw-sr-in:not(.jw-sr-done) .jw-mvv2-vision { animation: jw-sr-rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 0.25s backwards; }
}
@keyframes jw-sr-item { from { opacity: 0; transform: translateY(12px); } }
@keyframes jw-sr-rise { from { opacity: 0; transform: translateY(18px); filter: blur(4px); } }

/* Thẻ ở Home/trang: đổ bóng sâu hơn khi hover (không nhảy vị trí) */
.jw-panel:not(.jw-panel--flat) { transition: box-shadow 0.35s ease, opacity 0.7s cubic-bezier(0.2, 0.7, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
.jw-panel.jw-glass:not(.jw-panel--flat):hover { box-shadow: 0 1px 2px rgba(28, 25, 23, 0.05), 0 22px 44px -24px rgba(60, 36, 12, 0.28); }
[data-theme='dark'] .jw-panel.jw-glass:not(.jw-panel--flat):hover { box-shadow: inset 0 1px 0 var(--glass-spec), inset 0 -1px 0 var(--glass-spec-lo), 0 22px 48px -24px rgba(0, 0, 0, 0.8); }
.jw-panel-name { font-size: 1.02rem; font-weight: 700; letter-spacing: -0.02em; }
/* Vạch dọc trước tiêu đề thẻ (thay cho ô icon đã bỏ) — mảnh, cam, cao bằng chữ */
.jw-panel-name > span:first-child { position: relative; padding-left: 0.8rem; }
.jw-panel-name > span:first-child::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0.18em;
  bottom: 0.18em;
  width: 3px;
  border-radius: 2px;
  background: var(--accent);
}

/* ==========================================================================
   §HIỆU ỨNG HOVER
   1) ĐÈN theo con trỏ (Reveal kiểu Windows): app.js ghi --mx/--my (toạ độ chuột TÍNH
      TRONG phần tử) và bật `data-rv` cho mọi phần tử nằm trong bán kính --rv-r quanh chuột
      ⇒ VIỀN của cả các phần tử lân cận sáng lên theo khoảng cách; phần tử đang hover thì
      NỀN sáng thêm một vệt quanh chuột. Viền = ::before, khoét giữa bằng mask như gờ kính
      (ô nhập <input> không có ::before ⇒ vẽ viền sáng bằng nền 2 lớp padding-box/border-box).
   2) ICON NHẢY: hover ⇒ icon bật lên + phóng nhẹ (đường cong vượt đích = cú nảy).
   ========================================================================== */
:is(.jw-sn-fav, .jw-sn-hit, .jw-sn-me, .jw-sn-tool, .jw-sn-toggle, .jw-sn-gear, .jw-pane) { position: relative; }
/* :where() = độ ưu tiên 0 ⇒ `[data-rv]::before` bên dưới luôn thắng được opacity */
:where(.jw-sn-top, .jw-tree-row, .jw-tree-leaf, .jw-sn-fav, .jw-sn-hit, .jw-sn-me, .jw-panel:not(.jw-panel--flat),
        .jw-pane, .jw-photo-thumb, .jw-mvv2-value, .jw-inbox-item, .jw-inbox-tile, .jw-mvv2, .jw-gsearch-box, .jw-sn-find,
        .jw-vtab, .jw-gs-item)::before,
:where(a.jw-rowi, button.jw-rowi)::after {
  content: '';
  position: absolute;
  inset: 0;
  padding: 1px;
  border-radius: inherit;
  background: radial-gradient(var(--rv-r) circle at var(--mx, -999px) var(--my, -999px), var(--rv-edge), transparent 70%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
/* Có viền 1px (panel · thẻ nhỏ trong panel · ô) ⇒ đèn phủ ĐÚNG lên viền đó */
:where(.jw-panel:not(.jw-panel--flat), .jw-pane, .jw-photo-thumb, .jw-mvv2-value, .jw-inbox-tile, .jw-mvv2, .jw-gsearch-box, .jw-sn-find)::before { inset: -1px; }
.jw-gsearch-box { position: relative; }
.jw-mvv2::before { z-index: 1; }
[data-rv]::before, [data-rv]:where(a.jw-rowi, button.jw-rowi)::after { opacity: 1; }
:is(.jw-sn-top, .jw-tree-row, .jw-tree-leaf, .jw-sn-fav, .jw-sn-hit, .jw-sn-me, a.jw-rowi, button.jw-rowi,
    .jw-pane, .jw-mvv2-value, .jw-inbox-item, .jw-inbox-tile, .jw-vtab, .jw-gs-item)[data-rv]:hover {
  background-image: radial-gradient(calc(var(--rv-r) * 0.85) circle at var(--mx) var(--my), var(--rv-fill), transparent 100%);
}

@media (prefers-reduced-motion: no-preference) {
  :is(.jw-sn-topico, .jw-tree-icon, .jw-tree-leaf > svg, .jw-sn-fav > svg, .jw-sn-hit-ico, .jw-tab > svg,
      .jw-seg-opt > svg, .jw-sn-me .jw-avatar, .jw-brand-mark, .jw-link-open > svg, .jw-vtab > svg, .jw-result > svg, .jw-gs-item > svg) {
    transition: transform 0.22s ease, color 0.16s ease;
  }
  :is(.jw-sn-top:hover .jw-sn-topico, .jw-tree-row:hover .jw-tree-icon, .jw-tree-leaf:hover > svg, .jw-sn-fav:hover > svg,
      .jw-sn-hit:hover .jw-sn-hit-ico, .jw-tab:hover > svg, .jw-seg-opt:hover > svg, .jw-sn-me:hover .jw-avatar,
      .jw-brandhome:hover .jw-brand-mark, .jw-link-open:hover > svg, .jw-vtab:hover > svg, .jw-result:hover > svg, .jw-gs-item:hover > svg) {
    transform: translateY(-2px);
    transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), color 0.16s ease;
  }
  /* CHỮ: nhích 2px sang phải khi hover hàng/mục (tinh tế — không đổi cỡ, không đổi đậm) */
  :is(.jw-sn-topname, .jw-tree-name, .jw-tree-leafname, .jw-sn-fav-name, .jw-sn-hit-name, .jw-inbox-name, .jw-ann-title, .jw-gs-name, .jw-sn-name, .jw-menu-item > span, .jw-deal-hosp, .jw-rank-name, .jw-mvv2-vname, .jw-vtab-name, .jw-result-title) {
    display: inline-block;
    transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.16s ease;
  }
  :is(.jw-sn-top:hover .jw-sn-topname, .jw-tree-row:hover .jw-tree-name, .jw-tree-leaf:hover .jw-tree-leafname, .jw-sn-fav:hover .jw-sn-fav-name,
      .jw-sn-hit:hover .jw-sn-hit-name, .jw-inbox-item:hover .jw-inbox-name, .jw-ann:hover .jw-ann-title, .jw-gs-item:hover .jw-gs-name,
      .jw-sn-me:hover .jw-sn-name, .jw-menu-item:hover > span, .jw-rowi:hover .jw-deal-hosp, .jw-rowi:hover .jw-rank-name,
      .jw-vtab:hover .jw-vtab-name, .jw-result:hover .jw-result-title) {
    transform: translateX(2px);
  }
  .jw-mvv2-value:hover .jw-mvv2-vname { color: var(--accent-text); }
  :is(.jw-tab, .jw-seg-opt) { transition: color 0.35s ease, letter-spacing 0.3s ease; }
  /* Bánh răng: hover = xoay nhẹ (mở panel = xoay hẳn, khai ở §SIDE PANEL) */
  .jw-sn-gear:not([aria-expanded='true']):hover svg { transform: rotate(60deg); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

}

  function routeBlock() {
    if (ROUTE.name === 'page') return PAGES[ROUTE.key].block.key;

  function onRoute() {
    var r = parseHash();
    if (r.fallback && location.hash && location.hash !== '#/home') {
      try { history.replaceState(null, '', '#/home'); } catch (e) { /* file:// */ }
    }
    // Link cũ (route tiếng Nhật) ⇒ thay URL bằng route tiếng Anh, không thêm bước vào lịch sử
    if (r.legacy) {
      try { history.replaceState(null, '', r.name === 'page' ? href(r.key) : setHref(r.tab, r.row)); } catch (e) { /* file:// */ }
    }
    ROUTE = r;
    closeFloating();
    S.drawer = false;
    // Sang một trang ⇒ khối chứa nó MỞ ra (các khối đang mở khác GIỮ nguyên — mở được nhiều khối)
    if (r.name === 'page') {
      var b = PAGES[r.key].block;
      if (b.children && !S.open[b.key]) { S.open[b.key] = true; saveOpen(); }
    }
    if (r.name === 'settings') S.homeDraft = null;
    renderSide();
    revealCurrent();
    renderPage(true);
  }
